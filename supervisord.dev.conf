[supervisord]
nodaemon=true

[program:uvicorn]
command=bash scripts/start_uvicorn.sh
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=999

[program:runner]
command=python scripts/run_with_reload.py python -m evalap.runners
directory=/app
environment=PYTHONPATH=.,LOG_LEVEL="INFO"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=999
stopasgroup=true
killasgroup=true

[program:docusaurus]
command=npm run start -- --port 3000 --host 0.0.0.0
directory=/app/docs
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=999

[program:streamlit]
command=streamlit run evalap/ui/demo_streamlit/app.py --server.runOnSave true --server.headless=true --server.port 8501
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
priority=999
